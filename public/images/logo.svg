<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="flameG" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E67E22"/>
      <stop offset="50%" stop-color="#F39C12"/>
      <stop offset="100%" stop-color="#F1C40F"/>
    </linearGradient>
    <radialGradient id="auraG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F1C40F" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#F1C40F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="waxG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8DAEF"/>
    </linearGradient>
    <style>
      .txt-brand { font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 27px; fill: #4A235A; letter-spacing: -0.5px; }
      .txt-amp { fill: #8E44AD; font-weight: 300; }
      .txt-sub { font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 9.5px; fill: #8E44AD; letter-spacing: 3.5px; }
      @media (prefers-color-scheme: dark) {
        .txt-brand { fill: #F4ECF7; }
        .txt-amp { fill: #C39BD3; }
        .txt-sub { fill: #D2B4DE; }
      }
    </style>
  </defs>

  <!-- Emblema de vela -->
  <g transform="translate(10, 5)">
    <!-- Aura de luz -->
    <circle cx="32" cy="28" r="26" fill="url(#auraG)"/>
    
    <!-- Sombra base -->
    <ellipse cx="32" cy="62" rx="18" ry="4" fill="#4A235A" opacity="0.2"/>
    
    <!-- Vela -->
    <path d="M 22 36 L 42 36 L 42 59 C 42 62, 22 62, 22 59 Z" fill="url(#waxG)"/>
    <ellipse cx="32" cy="36" rx="10" ry="3" fill="#F5EEF8"/>
    
    <!-- Mecha -->
    <line x1="32" y1="36" x2="32" y2="30" stroke="#2C3E50" stroke-width="1.8" stroke-linecap="round"/>
    
    <!-- Llama -->
    <path d="M 32 10 C 27 18, 26 23, 32 30 C 38 23, 37 18, 32 10 Z" fill="url(#flameG)"/>
    <ellipse cx="32" cy="24" rx="2.2" ry="4" fill="#FFF9E6"/>
    
    <!-- Destellos de aroma -->
    <circle cx="14" cy="22" r="1.5" fill="#F1C40F" opacity="0.8"/>
    <circle cx="48" cy="18" r="1.2" fill="#F1C40F" opacity="0.8"/>
    <circle cx="46" cy="30" r="1" fill="#F39C12" opacity="0.6"/>
  </g>

  <!-- Tipografía de marca -->
  <text x="72" y="43" class="txt-brand">Velass<tspan class="txt-amp">&amp;</tspan>Esencia</text>
  <text x="74" y="60" class="txt-sub">VELAS ARTESANALES</text>
</svg>