<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velass&amp;Esencia — Iniciar sesión</title>
    <meta name="description" content="Acceso a la plataforma de Velass&amp;Esencia.">
    <meta name="robots" content="noindex,follow">
    <meta name="theme-color" content="#8E44AD">

    <!-- Favicon & App Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="alternate icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Tema sin flash (UX-3, Apple HIG) -->
    <script src="js/theme-init.js"></script>
</head>

<body class="auth-page">
    <a href="#main-content" class="skip-link">Saltar al contenido principal</a>
    <header class="navbar">
        <div class="nav-left">
            <button id="hamburger-btn" class="hamburger-btn" type="button" aria-label="Abrir menú de navegación" aria-expanded="false" aria-controls="sidebar-menu" title="Menú">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
        <div class="logo-container">
            <img src="/images/logo.svg" onerror="this.onerror=null; this.src='/images/logo.png';"
                alt="Velass&Esencia Logo" class="logo-img" width="160" height="40">
        </div>
        <div class="nav-right">
            <button id="theme-toggle" class="theme-btn" type="button" aria-label="Alternar tema oscuro o claro" aria-pressed="false" title="Alternar Modo Oscuro">
                <svg id="moon-icon" viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2"
                    fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
        </div>
    </header>

    <!-- Sidebar Menu -->
    <div id="sidebar-menu" class="sidebar">
        <button id="close-sidebar" class="close-sidebar-btn" title="Cerrar menú">&times;</button>
        <div class="sidebar-content">
            <div class="sidebar-logo">
                <img src="/images/logo.svg" onerror="this.onerror=null; this.src='/images/logo.png';" alt="Logo">
            </div>
            <nav class="sidebar-nav">
                <a href="index.html">Catálogo</a>
                <a href="index.html#candle-test">Descubre tu Vela</a>
                <a href="login.html" class="active">Iniciar Sesión</a>
            </nav>
        </div>
    </div>
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <main id="main-content" class="auth-container" tabindex="-1">
        <div class="auth-card" id="login-card">
            <h2>Iniciar Sesión</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="login-email">Correo Electrónico</label>
                    <input type="email" id="login-email" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Contraseña</label>
                    <input type="password" id="login-password" required>
                </div>
                <button type="submit" class="btn primary-btn">Entrar</button>
            </form>
            <p class="toggle-auth">¿No tienes cuenta? <a href="#" id="show-register">Regístrate aquí</a></p>
           
        </div>

        <div class="auth-card" id="register-card" style="display: none;">
            <h2>Registro</h2>
            <form id="register-form">
                <div class="form-group">
                    <label for="reg-name">Nombre Completo</label>
                    <input type="text" id="reg-name" required>
                </div>
                <div class="form-group">
                    <label for="reg-email">Correo Electrónico</label>
                    <input type="email" id="reg-email" required>
                </div>
                <div class="form-group">
                    <label for="reg-password">Contraseña</label>
                    <input type="password" id="reg-password" required>
                </div>
                <button type="submit" class="btn primary-btn">Crear Cuenta</button>
            </form>
            <p class="toggle-auth">¿Ya tienes cuenta? <a href="#" id="show-login">Inicia Sesión</a></p>
        </div>
    </main>

    <script src="js/toast.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
