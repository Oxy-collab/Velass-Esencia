<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B59B6"/>
      <stop offset="50%" stop-color="#8E44AD"/>
      <stop offset="100%" stop-color="#4A235A"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E67E22"/>
      <stop offset="40%" stop-color="#F39C12"/>
      <stop offset="80%" stop-color="#F1C40F"/>
      <stop offset="100%" stop-color="#FFF9E6"/>
    </linearGradient>
    <radialGradient id="auraGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F1C40F" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#E67E22" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8E44AD" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="waxGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F5EEF8"/>
      <stop offset="100%" stop-color="#D7BDE2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fondo squircle elegante de marca -->
  <rect width="512" height="512" rx="120" ry="120" fill="url(#bgGrad)"/>
  <rect width="496" height="496" x="8" y="8" rx="112" ry="112" fill="none" stroke="#F5EEF8" stroke-width="3" stroke-opacity="0.25"/>

  <!-- Halo de luz cálida -->
  <circle cx="256" cy="180" r="130" fill="url(#auraGrad)"/>

  <!-- Destellos sutiles de aroma / chispa mágica -->
  <path d="M 160 140 Q 165 145 165 150 Q 165 145 170 140 Q 165 135 165 130 Q 165 135 160 140 Z" fill="#F9E79F" opacity="0.8"/>
  <path d="M 350 170 Q 354 174 354 178 Q 354 174 358 170 Q 354 166 354 162 Q 354 166 350 170 Z" fill="#F9E79F" opacity="0.8"/>
  <path d="M 330 110 Q 333 113 333 117 Q 333 113 337 110 Q 333 107 333 103 Q 333 107 330 110 Z" fill="#F9E79F" opacity="0.6"/>

  <!-- Rama de lavanda sutil / esencia botánica -->
  <path d="M 145 380 Q 160 330 180 290" fill="none" stroke="#D2B4DE" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <ellipse cx="165" cy="340" rx="9" ry="5" fill="#D7BDE2" transform="rotate(-30 165 340)" opacity="0.8"/>
  <ellipse cx="178" cy="315" rx="8" ry="4.5" fill="#BB8FCE" transform="rotate(25 178 315)" opacity="0.8"/>
  <ellipse cx="182" cy="290" rx="7" ry="4" fill="#D7BDE2" transform="rotate(-20 182 290)" opacity="0.8"/>

  <!-- Plato base o reflejo sutil -->
  <ellipse cx="256" cy="410" rx="120" ry="24" fill="#381845" opacity="0.4"/>
  <ellipse cx="256" cy="405" rx="100" ry="18" fill="#5B2C6F" opacity="0.3"/>

  <!-- Cuerpo de la vela artesanal -->
  <path d="M 195 240
           C 205 245, 230 248, 256 248
           C 282 248, 307 245, 317 240
           L 317 380
           C 317 396, 195 396, 195 380
           Z" fill="url(#waxGrad)"/>

  <!-- Cima cóncava de la vela -->
  <ellipse cx="256" cy="240" rx="61" ry="14" fill="#E8DAEF"/>
  <ellipse cx="256" cy="240" rx="52" ry="11" fill="#F5EEF8"/>
  <ellipse cx="256" cy="241" rx="20" ry="6" fill="#D2B4DE" opacity="0.6"/>

  <!-- Gota de cera derritiéndose con elegancia -->
  <path d="M 210 245 Q 206 280 208 295 C 209 302, 218 302, 218 295 Q 217 270 220 246 Z" fill="#FDFEFE"/>

  <!-- Mecha -->
  <path d="M 256 242 Q 257 225 253 210" fill="none" stroke="#2C3E50" stroke-width="5" stroke-linecap="round"/>

  <!-- Llama exterior dorada / ámbar -->
  <path d="M 253 214
           C 240 195, 222 170, 236 130
           C 245 100, 253 72, 253 72
           C 253 72, 261 100, 270 130
           C 284 170, 266 195, 253 214 Z"
        fill="url(#flameGrad)" filter="url(#glow)"/>

  <!-- Núcleo interior brillante de la llama -->
  <path d="M 253 210
           C 246 198, 236 180, 243 150
           C 248 132, 253 112, 253 112
           C 253 112, 258 132, 263 150
           C 270 180, 260 198, 253 210 Z"
        fill="#FFFFFF" opacity="0.95"/>
</svg>