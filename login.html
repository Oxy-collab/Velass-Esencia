<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velass&Esencia - Mi Cuenta</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="navbar">
        <button id="theme-toggle" class="theme-btn">
            <svg id="moon-icon" viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </button>
        <div class="logo-container">
            <img src="https://cdn.phototourl.com/free/2026-03-25-86eb837e-6f5a-4227-a92e-9e78d32f9aa2.png" alt="Velass&Esencia Logo" class="logo-img">
        </div>
        <nav>
            <a href="index.html">Catálogo</a>
            <a href="dashboard.html" class="active" id="nav-dashboard">Mi Cuenta</a>
            <a href="admin.html" id="nav-admin" style="display:none;">Admin</a>
            <a href="#" id="nav-logout">Cerrar Sesión</a>
            <a href="cart.html" class="nav-cart-btn" id="nav-cart">
                🛍️
                <span class="cart-badge" id="cart-badge" style="display:none;">0</span>
            </a>
        </nav>
    </header>

    <main class="dashboard-page">
        <!-- Header del perfil -->
        <div class="dashboard-header reveal">
            <div class="dashboard-avatar" id="dashboard-avatar">U</div>
            <div class="dashboard-user-info">
                <h2 id="dashboard-name">Cargando...</h2>
                <p id="dashboard-email"></p>
            </div>
        </div>

        <!-- Tabs de navegación -->
        <div class="dashboard-tabs">
            <button class="tab-btn active" data-tab="orders">📦 Mis Pedidos</button>
            <button class="tab-btn" data-tab="wishlist">♡ Lista de deseos</button>
            <button class="tab-btn" data-tab="profile">👤 Mi Perfil</button>
        </div>

        <!-- Tab: Pedidos -->
        <div class="tab-content active" id="tab-orders">
            <div id="orders-list">
                <div class="loading-spinner">Cargando pedidos...</div>
            </div>
        </div>

        <!-- Tab: Wishlist -->
        <div class="tab-content" id="tab-wishlist">
            <div class="wishlist-grid" id="wishlist-grid">
                <div class="loading-spinner">Cargando favoritos...</div>
            </div>
        </div>

        <!-- Tab: Perfil -->
        <div class="tab-content" id="tab-profile">
            <div class="profile-form-card">
                <h3>Editar perfil y dirección de envío</h3>
                <p class="form-hint">Esta información se usará para agilizar futuros pedidos.</p>
                <form id="profile-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="profile-name">Nombre completo</label>
                            <input type="text" id="profile-name" required>
                        </div>
                        <div class="form-group">
                            <label for="profile-email">Correo electrónico</label>
                            <input type="email" id="profile-email" disabled>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="profile-phone">Teléfono / WhatsApp</label>
                        <input type="tel" id="profile-phone" placeholder="3001234567">
                    </div>
                    <div class="form-group">
                        <label for="profile-address">Dirección de envío</label>
                        <input type="text" id="profile-address" placeholder="Calle, carrera, # casa/apto">
                    </div>
                    <div class="form-group">
                        <label for="profile-city">Ciudad</label>
                        <input type="text" id="profile-city" placeholder="Cúcuta, Bogotá...">
                    </div>
                    <button type="submit" class="btn primary-btn">Guardar cambios</button>
                </form>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Velass&Esencia. Todos los derechos reservados.</p>
    </footer>

    <script src="js/app.js"></script>
    <script src="js/cart.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = JSON.parse(localStorage.getItem('currentUser'));
            if (!user) { window.location.href = 'login.html'; return; }
            CartSystem.init();
            await UserDashboard.init();

            // Tabs
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                    btn.classList.add('active');
                    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
                });
            });
        });
    </script>
</body>
</html>
