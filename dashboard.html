<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velass&Esencia - Mi Carrito</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="navbar">
        <button id="theme-toggle" class="theme-btn" title="Alternar Modo Oscuro">
            <svg id="moon-icon" viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </button>
        <div class="logo-container">
            <img src="https://cdn.phototourl.com/free/2026-03-25-86eb837e-6f5a-4227-a92e-9e78d32f9aa2.png" alt="Velass&Esencia Logo" class="logo-img">
        </div>
        <nav>
            <a href="index.html">Catálogo</a>
            <a href="login.html" id="nav-login">Iniciar Sesión</a>
            <a href="dashboard.html" id="nav-dashboard" style="display:none;">Mi Cuenta</a>
            <a href="admin.html" id="nav-admin" style="display:none;">Admin</a>
            <a href="#" id="nav-logout" style="display:none;">Cerrar Sesión</a>
            <a href="cart.html" class="nav-cart-btn active" id="nav-cart">
                🛍️ Carrito
                <span class="cart-badge" id="cart-badge" style="display:none;">0</span>
            </a>
        </nav>
    </header>

    <main class="cart-page">
        <h1 class="page-title">🛍️ Mi Carrito</h1>
        <div class="cart-layout">
            <div class="cart-items-col">
                <div id="cart-items-container">
                    <div class="loading-spinner">Cargando...</div>
                </div>
            </div>
            <div class="cart-summary-col" id="cart-summary">
                <div class="cart-summary-card">
                    <h3>Resumen del pedido</h3>
                    <div class="summary-row total-row">
                        <span>Total</span>
                        <strong id="cart-total">$0</strong>
                    </div>
                    <a href="checkout.html" class="btn primary-btn" id="btn-checkout" style="width:100%;text-align:center;margin-top:1rem;display:block;">
                        Continuar al pago →
                    </a>
                    <a href="index.html" class="btn text-btn" style="width:100%;text-align:center;margin-top:0.5rem;display:block;">
                        ← Seguir comprando
                    </a>
                </div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Velass&Esencia. Todos los derechos reservados.</p>
    </footer>

    <script src="js/app.js"></script>
    <script src="js/cart.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            CartSystem.init();
            CartSystem.renderCart();
            // Verificar login para el botón de checkout
            const user = JSON.parse(localStorage.getItem('currentUser'));
            const btnCheckout = document.getElementById('btn-checkout');
            if (!user && btnCheckout) {
                btnCheckout.href = 'login.html';
                btnCheckout.textContent = 'Inicia sesión para continuar →';
            }
        });
    </script>
</body>
</html>
