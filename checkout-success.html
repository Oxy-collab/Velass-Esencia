<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Pago completado</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body { font-family: Arial, sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; background:#f7f5fb }
    .card { text-align:center; padding:2rem; border-radius:12px; box-shadow:0 8px 30px rgba(0,0,0,0.08); background:white }
    h1 { color:#2c1e38; }
    a{ color:#8E44AD; font-weight:600 }
  </style>
</head>
<body>
  <div class="card">
    <h1>Gracias — Pago recibido</h1>
    <p>Tu pago fue procesado. Si necesitas soporte, contáctanos por Instagram o WhatsApp.</p>
    <p style="margin-top:1rem;"><a href="/index.html">Volver al catálogo</a></p>
    <pre id="data" style="text-align:left;margin-top:1rem;display:none;"></pre>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    if ([...params].length) {
      const pre = document.getElementById('data');
      pre.style.display = 'block';
      pre.textContent = 'Query params:\n' + [...params.entries()].map(p => p.join(': ')).join('\n');
    }
  </script>
</body>
</html>
